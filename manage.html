<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage VPX Tables</title><style>
:root{--bg:#070914;--panel:#11162a;--panel2:#171e38;--border:#33406d;--text:#f7f8ff;--muted:#aeb7d8;--cyan:#38e8ff;--green:#56f39a;--yellow:#ffd84a;--red:#ff667d;--shadow:0 16px 40px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(145deg,#050711,#0b1022 45%,#070914);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1100px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.hero,.panel,.toolbar{border:1px solid var(--border);background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}.hero{padding:28px 22px;margin-bottom:18px;border-radius:22px;text-align:center}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0 0;font-size:clamp(2rem,6vw,3.8rem);text-transform:uppercase}.toolbar{display:flex;justify-content:space-between;gap:12px;padding:14px;margin-bottom:18px;border-radius:16px}.button,.primary,.warning{min-height:42px;padding:10px 14px;border-radius:10px;font-weight:800}.button{color:#fff;border:1px solid var(--border);background:var(--panel2);text-decoration:none}.primary{color:#07101b;border:0;background:linear-gradient(90deg,var(--cyan),var(--green))}.warning{color:#151008;border:0;background:var(--yellow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:22px;border-radius:18px}.full{grid-column:1/-1}.form-grid{display:grid;gap:14px}label{display:block;margin-bottom:6px;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase}input,select{width:100%;min-height:44px;padding:10px 12px;color:#fff;border:1px solid var(--border);border-radius:10px;background:#090d1c}option{color:#000;background:#fff}.status{display:none;padding:12px;margin-top:12px;border-radius:10px}.status.show{display:block}.success{color:#dffff0;border:1px solid rgba(86,243,154,.45);background:rgba(86,243,154,.1)}.error{color:#ffe7ec;border:1px solid rgba(255,102,125,.45);background:rgba(255,102,125,.1)}.info{color:#e4fbff;border:1px solid rgba(56,232,255,.4);background:rgba(56,232,255,.09)}.muted{color:var(--muted)}.inventory{display:grid;gap:8px;max-height:520px;overflow-y:auto}.table-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#090d1c}.inactive{opacity:.6}.actions{display:flex;gap:8px;flex-wrap:wrap}.id{display:block;color:var(--muted);font:12px monospace;margin-top:4px}.edit{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:8px}.inventory-tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.preview{display:grid;gap:8px;max-height:450px;overflow-y:auto}.preview-item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px;border:1px solid var(--border);border-radius:9px;background:#090d1c}.progress{display:none;margin-top:12px}.progress.show{display:block}.track{height:12px;background:#090d1c;border:1px solid var(--border);border-radius:999px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green))}@media(max-width:760px){.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.table-item,.edit,.inventory-tools{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">VPX Remote Leaderboard</div><h1>Manage Tables</h1><p class="muted">Add, import, rename, deactivate, reactivate, and select the monthly challenge.</p></header><nav class="toolbar"><a class="button" href="index.html">Return to Leaderboard</a><div><span id="authText" class="muted">Checking sign-in...</span> <button id="signOutButton" class="button" hidden>Sign Out</button></div></nav>
<section id="loginPanel" class="panel"><h2>Player Sign In</h2><form id="loginForm" class="form-grid"><div><label>Email</label><input id="emailInput" type="email" required></div><div><label>Password</label><input id="passwordInput" type="password" required></div><button class="primary">Sign In</button></form><div id="loginMessage" class="status"></div></section>
<section id="manageArea" class="grid" hidden>
<article class="panel"><h2>Add One Table</h2><form id="addForm" class="form-grid"><div><label>Table name</label><input id="newName" required maxlength="150"></div><button class="primary">Add Table</button></form><div id="addMessage" class="status"></div></article>
<article class="panel"><h2>Table of the Month</h2><form id="challengeForm" class="form-grid"><div><label>Month</label><input id="challengeMonth" type="month" required></div><div><label>Challenge table</label><select id="challengeTable" required></select></div><div><label>Previous monthly winner (optional)</label><input id="previousWinner" maxlength="100"></div><button class="primary">Save Monthly Challenge</button></form><div id="challengeMessage" class="status"></div></article>
<article class="panel full"><h2>Bulk Import</h2><input id="fileInput" type="file" accept=".txt,text/plain"><div id="fileMessage" class="status"></div><div id="preview" class="preview"></div><div class="actions" style="margin-top:10px"><button id="importButton" class="primary" hidden>Import Selected</button><button id="clearButton" class="button" hidden>Clear</button></div><div id="progress" class="progress"><div class="track"><div id="fill" class="fill"></div></div><p id="progressText" class="muted"></p></div><div id="importMessage" class="status"></div></article>
<article class="panel full"><h2>Table Inventory</h2><p id="inventorySummary" class="muted"></p><div class="inventory-tools"><input id="search" type="search" placeholder="Search table names..."><button id="inactiveButton" class="button">Show Inactive</button></div><div id="inventoryMessage" class="status"></div><div id="inventory" class="inventory"></div></article>
</section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBBHsii5ui8Y7lYqvG3GyVwOA7bGAFDePM",
  authDomain: "vpx-remote-leaderboard.firebaseapp.com",
  projectId: "vpx-remote-leaderboard",
  storageBucket: "vpx-remote-leaderboard.firebasestorage.app",
  messagingSenderId: "553175271649",
  appId: "1:553175271649:web:fb55a1745236ea370f4fa0"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),state={user:null,player:null,tables:[],preview:[],showInactive:false,editing:null};const $=id=>document.getElementById(id);const E={authText:$("authText"),signOutButton:$("signOutButton"),loginPanel:$("loginPanel"),loginForm:$("loginForm"),emailInput:$("emailInput"),passwordInput:$("passwordInput"),loginMessage:$("loginMessage"),manageArea:$("manageArea"),addForm:$("addForm"),newName:$("newName"),addMessage:$("addMessage"),challengeForm:$("challengeForm"),challengeMonth:$("challengeMonth"),challengeTable:$("challengeTable"),previousWinner:$("previousWinner"),challengeMessage:$("challengeMessage"),fileInput:$("fileInput"),fileMessage:$("fileMessage"),preview:$("preview"),importButton:$("importButton"),clearButton:$("clearButton"),progress:$("progress"),fill:$("fill"),progressText:$("progressText"),importMessage:$("importMessage"),inventorySummary:$("inventorySummary"),search:$("search"),inactiveButton:$("inactiveButton"),inventoryMessage:$("inventoryMessage"),inventory:$("inventory")};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function msg(n,t,c="info"){n.textContent=t;n.className=`status show ${c}`}function clear(n){n.textContent="";n.className="status"}function slug(v){return v.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g," and ").replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,100)}function clean(v){return v.trim().replace(/\.vpx$/i,"").replace(/_/g," ").replace(/\s+/g," ").trim()}function monthKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
async function load(){const s=await getDocs(collection(db,"tables"));state.tables=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name)));renderInventory();populateChallenge()}
function populateChallenge(){E.challengeTable.innerHTML='<option value="">Select a table</option>'+state.tables.filter(t=>t.active===true).map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("");if(!E.challengeMonth.value)E.challengeMonth.value=monthKey()}
function renderInventory(){const q=E.search.value.toLowerCase(),list=state.tables.filter(t=>(state.showInactive||t.active===true)&&String(t.name).toLowerCase().includes(q)),active=state.tables.filter(t=>t.active===true).length;E.inventorySummary.textContent=`${active} active and ${state.tables.length-active} inactive tables.`;E.inactiveButton.textContent=state.showInactive?"Hide Inactive":"Show Inactive";E.inventory.innerHTML=list.map(t=>`<article class="table-item ${t.active===true?"":"inactive"}"><div><strong>${esc(t.name)}</strong><span class="id">${esc(t.id)}</span>${state.editing===t.id?`<div class="edit"><input id="edit-${esc(t.id)}" value="${esc(t.name)}"><button class="primary" data-save="${esc(t.id)}">Save</button><button class="button" data-cancel>Cancel</button></div>`:""}</div><div class="actions"><button class="button" data-edit="${esc(t.id)}">Rename</button><button class="${t.active===true?"warning":"primary"}" data-toggle="${esc(t.id)}">${t.active===true?"Deactivate":"Reactivate"}</button></div></article>`).join("")||'<p class="muted">No matching tables.</p>';E.inventory.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.editing=b.dataset.edit;renderInventory()});E.inventory.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{state.editing=null;renderInventory()});E.inventory.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>rename(b.dataset.save));E.inventory.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggle(b.dataset.toggle))}
async function addTable(name,id=""){const n=clean(name),tableId=id||slug(n);if(!n||!tableId)throw Error("Invalid table name.");const ref=doc(db,"tables",tableId),found=await getDoc(ref);if(found.exists())return false;await setDoc(ref,{name:n,active:true,createdAt:serverTimestamp(),createdBy:state.user.uid});return true}async function rename(id){const n=$(`edit-${id}`).value.trim();if(!n)return;try{await updateDoc(doc(db,"tables",id),{name:n});state.editing=null;msg(E.inventoryMessage,`Renamed to "${n}".`,"success");await load()}catch(e){console.error(e);msg(E.inventoryMessage,"Rename failed.","error")}}async function toggle(id){const t=state.tables.find(x=>x.id===id);try{await updateDoc(doc(db,"tables",id),{active:t.active!==true});msg(E.inventoryMessage,`"${t.name}" is now ${t.active===true?"inactive":"active"}.`,"success");await load()}catch(e){console.error(e);msg(E.inventoryMessage,"Status change failed.","error")}}
E.loginForm.onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,E.emailInput.value.trim(),E.passwordInput.value)}catch(err){msg(E.loginMessage,"Sign-in failed.","error")}};E.signOutButton.onclick=async()=>{await signOut(auth);location.href="index.html"};E.addForm.onsubmit=async e=>{e.preventDefault();try{const ok=await addTable(E.newName.value);msg(E.addMessage,ok?"Table added.":"Table already exists.",ok?"success":"info");if(ok){E.addForm.reset();await load()}}catch(err){msg(E.addMessage,"Table could not be added.","error")}};E.challengeForm.onsubmit=async e=>{e.preventDefault();const key=E.challengeMonth.value,tableId=E.challengeTable.value;if(!key||!tableId)return;try{await setDoc(doc(db,"monthlyChallenges",key),{monthKey:key,tableId,previousWinnerName:E.previousWinner.value.trim(),createdAt:serverTimestamp(),createdBy:state.user.uid},{merge:true});msg(E.challengeMessage,`Monthly challenge saved for ${key}.`,"success")}catch(err){console.error(err);msg(E.challengeMessage,"Monthly challenge could not be saved. Check the Firestore rules.","error")}};E.search.oninput=renderInventory;E.inactiveButton.onclick=()=>{state.showInactive=!state.showInactive;renderInventory()};E.fileInput.onchange=async()=>{const f=E.fileInput.files?.[0];if(!f)return;state.preview=(await f.text()).split(/\r?\n/).map(clean).filter(Boolean).map(name=>({name,id:slug(name),selected:true}));E.preview.innerHTML=state.preview.map((x,i)=>`<label class="preview-item"><input type="checkbox" data-i="${i}" checked><span><strong>${esc(x.name)}</strong><span class="id">${esc(x.id)}</span></span></label>`).join("");E.preview.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>state.preview[Number(c.dataset.i)].selected=c.checked);E.importButton.hidden=false;E.clearButton.hidden=false;msg(E.fileMessage,`${state.preview.length} entries ready for review.`,"success")};E.clearButton.onclick=()=>{state.preview=[];E.fileInput.value="";E.preview.innerHTML="";E.importButton.hidden=true;E.clearButton.hidden=true};E.importButton.onclick=async()=>{const items=state.preview.filter(x=>x.selected);E.progress.classList.add("show");let added=0,skipped=0,failed=0;for(let i=0;i<items.length;i++){E.fill.style.width=`${Math.round((i+1)/items.length*100)}%`;E.progressText.textContent=`${i+1} of ${items.length}: ${items[i].name}`;try{await addTable(items[i].name,items[i].id)?added++:skipped++}catch(err){failed++}}msg(E.importMessage,`${added} added, ${skipped} skipped, ${failed} failed.`,failed?"error":"success");await load()};onAuthStateChanged(auth,async user=>{state.user=user;if(!user){E.loginPanel.hidden=false;E.manageArea.hidden=true;return}const p=await getDoc(doc(db,"players",user.uid));if(!p.exists()||p.data().active!==true){await signOut(auth);return}state.player={id:p.id,...p.data()};E.authText.textContent=`Signed in as ${state.player.name}`;E.signOutButton.hidden=false;E.loginPanel.hidden=true;E.manageArea.hidden=false;await load()});
</script></body></html>
